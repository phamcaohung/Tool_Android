# docker-compose.yml - Cấu hình để chạy APK Tool Analyzer dễ dàng
version: '3.8'

services:
  apktool-analyzer:
    # Build image từ Dockerfile trong thư mục hiện tại
    build:
      context: .
      dockerfile: Dockerfile
    
    # Tên container
    container_name: apktool-analyzer
    
    # Port mapping: host:container
    # Truy cập ứng dụng tại http://localhost:5070
    ports:
      - "5070:5070"
    
    # Volume mounts để lưu trữ dữ liệu
    volumes:
      # Mount thư mục uploads để lưu APK files (nếu cần persist)
      - ./uploads:/app/uploads
      # Mount thư mục temp cho các file tạm thời
      - ./temp:/app/temp
    
    # Biến môi trường (có thể tùy chỉnh)
    environment:
      - PYTHONUNBUFFERED=1
      # Có thể set APKTOOL_PATH nếu muốn dùng apktool từ nơi khác
      # - APKTOOL_PATH=/usr/local/bin/apktool
    
    # Restart policy: tự động restart nếu container bị dừng
    restart: unless-stopped
    
    # Resource limits (tùy chọn - có thể điều chỉnh)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

